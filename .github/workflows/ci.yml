name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Validate SAM template
        run: cfn-lint infra/template.yaml
      - name: Tests (fake Claude + offline embeddings, no AWS needed)
        run: pytest -v
      - name: Offline dry run on the sample
        run: >-
          rag-translate strings sample/strings.csv --locales de-DE,ja-JP --dry-run --embedder hash
          --glossary sample/glossary.csv --memory sample/memory.csv
