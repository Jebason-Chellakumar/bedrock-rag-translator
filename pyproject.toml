[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-rag-translator"
version = "0.1.0"
description = "Retrieval-augmented translation with Claude on Amazon Bedrock: translation memory, glossary and automatic QA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=1.0", "boto3>=1.34", "numpy>=1.26"]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
dev = ["pytest>=8", "ruff>=0.6", "cfn-lint>=1.0", "faiss-cpu>=1.8"]

[project.scripts]
rag-translate = "translator.cli:main"

[tool.setuptools]
packages = ["translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) is 3.10+; the core also runs on 3.9
